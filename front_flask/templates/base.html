<!DOCTYPE html>
<!-- base.html — Bootstrap 5 + la MARCA como capa encima (docs/MANUAL_DE_MARCA.md) -->
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Los Andes{% endblock %} · Comercial Los Andes S.A.</title>
    <!-- 1º Bootstrap (la base)… -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- …2º la marca (la personalización SIEMPRE va después, para ganar) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='marca.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2317495B'/><text x='8' y='12' font-size='10' text-anchor='middle' fill='%23E39B2D'>▲</text></svg>">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark navbar-marca px-3">
    <span class="navbar-brand logosimbolo">
        <span class="logotipo">Los Andes</span> <span class="isotipo">▲</span>
        <small class="descriptor">comercial s.a.</small>
    </span>
    {% if session.usuario %}
    <div class="navbar-nav">
        <a class="nav-link" href="{{ url_for('listar') }}">Productos</a>
    </div>
    <div class="ms-auto d-flex align-items-center">
        <span class="navbar-text me-3">{{ session.usuario }}</span>
        <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">Salir</a>
    </div>
    {% endif %}
</nav>
<main class="container py-4">
    {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensaje in mensajes %}
        <div class="alert {{ 'alert-success' if categoria == 'exito' else 'alert-danger' }}" role="alert">
            {{ mensaje }}
        </div>
        {% endfor %}
    {% endwith %}
    {% block contenido %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
